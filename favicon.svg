<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Strawberry (Left) -->
    <g transform="translate(6, 12)">
        <!-- Strawberry Body -->
        <path d="M12 2 C18 2, 24 8, 24 16 C24 24, 18 34, 12 38 C6 34, 0 24, 0 16 C0 8, 6 2, 12 2 Z" fill="#c1272d" />
        <!-- Strawberry Leaf -->
        <path d="M12 0 C15 3, 18 2, 20 4 C15 5, 13 6, 12 9 C11 6, 9 5, 4 4 C6 2, 9 3, 12 0 Z" fill="#1a9c4d" />
        <!-- Strawberry Seeds -->
        <circle cx="8" cy="10" r="1.2" fill="#fedf00" />
        <circle cx="16" cy="12" r="1.2" fill="#fedf00" />
        <circle cx="6" cy="18" r="1.2" fill="#fedf00" />
        <circle cx="12" cy="20" r="1.2" fill="#fedf00" />
        <circle cx="18" cy="18" r="1.2" fill="#fedf00" />
        <circle cx="9" cy="26" r="1.2" fill="#fedf00" />
        <circle cx="15" cy="28" r="1.2" fill="#fedf00" />
        <circle cx="12" cy="32" r="1.2" fill="#fedf00" />
    </g>
    <!-- Tomato (Right) -->
    <g transform="translate(32, 18)">
        <!-- Tomato Body -->
        <circle cx="14" cy="16" r="15" fill="#e63946" />
        <!-- Tomato Leaf/Stem -->
        <path d="M14 1 C15 4, 18 3, 21 5 C17 6, 15 7, 14 10 C13 7, 11 6, 7 5 C10 3, 13 4, 14 1 Z" fill="#1a9c4d" />
        <path d="M14 1 Q14 -1 12 -3" stroke="#1a9c4d" stroke-width="2" fill="none" />
        <!-- Tomato Gloss Highlight -->
        <ellipse cx="9" cy="10" rx="4" ry="2" fill="#ffffff" opacity="0.6" transform="rotate(-30 9 10)" />
    </g>
</svg>
